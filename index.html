<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PosterD45h — Rapid Poster Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Poppins:wght@400;600;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- foundations ---------- */
:root{
  --bg:#0f1115; --surface:#1a1d24; --surface2:#22262f; --line:#2d313c;
  --text:#ffffff; --text-dim:#8b919e; --accent:#ff4d4d; --accent2:#00e0ff;
  --tb:56px;
  --f-ui:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;height:var(--tb);background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:36px;height:36px}
.brand-name{font:800 18px var(--f-ui);letter-spacing:-0.02em}
.brand-name span{color:var(--accent)}
.actions{display:flex;align-items:center;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 13px var(--f-ui);padding:8px 14px;border-radius:6px;border:1px solid transparent;background:transparent;transition:all .15s}
.btn:hover{background:var(--surface2)}
.btn.accent{background:var(--accent);color:#fff}
.btn.accent:hover{background:#ff3333}
.btn.ghost{border-color:var(--line);background:var(--surface)}
.btn.ghost:hover{background:var(--surface2);border-color:var(--text-dim)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - var(--tb))}
.rail{border-right:1px solid var(--line);padding:24px;overflow-y:auto;background:var(--surface)}

/* Fixed scrolling issue */
.stage{display:flex; flex-direction: row; justify-content:center; align-items:flex-start; overflow:auto; padding:48px; background-color: var(--bg); background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 24px 24px;}

/* ---------- text format toolbar ---------- */
.format-bar{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface2);padding:8px;border-radius:8px;border:1px solid var(--line);margin-bottom:12px;align-items:center}
.fmt-btn{width:32px;height:32px;display:grid;place-items:center;background:transparent;border:1px solid transparent;border-radius:4px;font-weight:bold;color:var(--text-dim);font-size:14px}
.fmt-btn:hover{background:var(--bg);color:var(--text)}
.fmt-btn svg{width:16px;height:16px;stroke:var(--text-dim)}
.fmt-btn:hover svg{stroke:var(--text)}
.fmt-select{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:6px 8px;border-radius:4px;font-size:13px;}
.fmt-color{width:32px;height:32px;padding:0;border:1px solid var(--line);background:transparent;cursor:pointer;}
.apply-all-wrapper{display:flex;align-items:center;gap:6px;margin-bottom:12px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.apply-all-wrapper input{cursor:pointer}
.apply-all-wrapper label{font-size:12px;color:var(--text);cursor:pointer;font-weight:600}

/* ---------- rail panels ---------- */
.panel{margin-bottom:32px}
.panel-title{font:700 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel-title::after{content:"";flex:1;height:1px;background:var(--line)}

.block-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.block-btn{padding:12px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;font:600 12px var(--f-ui);display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text-dim);transition:all .15s}
.block-btn:hover{color:var(--text);border-color:var(--accent);transform:translateY(-2px)}
.block-btn svg{width:20px;height:20px;stroke:var(--accent2)}

.tpl-list, .theme-list, .orient-list{display:flex;flex-direction:column;gap:8px}
.tpl-btn, .theme-btn, .orient-btn{text-align:left;padding:12px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;color:var(--text);font:600 13px var(--f-ui);display:flex;align-items:center;gap:10px;transition:all .15s}
.tpl-btn:hover, .theme-btn:hover, .orient-btn:hover{border-color:var(--accent2)}
.theme-btn.active, .orient-btn.active{border-color:var(--accent);background:rgba(255,77,77,0.1)}
.color-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--text-dim);flex:none}

/* ---------- canvas / sheet ---------- */
.sheet{background:#fff; color:#000; padding:20mm; display:flex; flex-direction:column; gap:16px; box-shadow:0 20px 50px rgba(0,0,0,0.5); transition:width .3s, min-height .3s, background .3s, color .3s; position:relative; overflow:hidden;}
.sheet.portrait { width:210mm; min-height:297mm; }
.sheet.landscape { width:297mm; min-height:210mm; }

/* Block Styling */
.block{position:relative;outline:none;transition:all .15s; padding: 4px; border: 1px dashed transparent;}
.block:hover{border-color:rgba(0,0,0,0.15)}
.block:focus-within{border-color:var(--accent); border-style: solid; border-width: 1px;} 
.block.tools-visible .block-tools{opacity:1; pointer-events:auto}

.block-tools{position:absolute;top:-12px;right:4px;display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px;opacity:0;pointer-events:none;transition:.15s;z-index:10; box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.block-tools button{background:transparent;border:0;padding:4px;display:grid;place-items:center;width:24px;height:24px;border-radius:3px}
.block-tools button:hover{background:#eee}
.block-tools svg{width:14px;height:14px;stroke:#555}

.block[data-type="h1"]{font-size:42px;font-weight:800;line-height:1.1;letter-spacing:-0.02em;}
.block[data-type="h2"]{font-size:24px;font-weight:700;line-height:1.2;letter-spacing:-0.01em;}
.block[data-type="body"]{font-size:16px;font-weight:400;line-height:1.6; color:#444;}
.block[data-type="shape"]{height:12px; background:#000; border-radius:6px; margin: 10px 0; align-self: flex-start; width: 60px;}
.block[data-type="image"]{min-height:150px; background:#eee; display:grid;place-items:center; color:#999; font-size:14px; background-size:cover; background-position:center;}

/* Accessible Themes - Rigidly applied via data-attribute to prevent editor stripping */
.sheet[data-theme="spring"] { background:#F0FFF4 !important; border-top:12px solid #10B981 !important; }
.sheet[data-theme="spring"] [data-type="h1"] { color:#065F46 !important; } 
.sheet[data-theme="spring"] [data-type="h2"] { color:#047857 !important; } 
.sheet[data-theme="spring"] [data-type="body"] { color:#065F46 !important; }
.sheet[data-theme="spring"] .block[data-type="shape"] { background:#10B981 !important; }

.sheet[data-theme="summer"] { background:#FFFDE7 !important; border-top:12px solid #F59E0B !important; }
.sheet[data-theme="summer"] [data-type="h1"] { color:#92400E !important; } 
.sheet[data-theme="summer"] [data-type="h2"] { color:#B45309 !important; } 
.sheet[data-theme="summer"] [data-type="body"] { color:#92400E !important; }
.sheet[data-theme="summer"] .block[data-type="shape"] { background:#F59E0B !important; }

.sheet[data-theme="autumn"] { background:#FFF3E0 !important; border-top:12px solid #D14C1E !important; }
.sheet[data-theme="autumn"] [data-type="h1"] { color:#7C2D12 !important; } 
.sheet[data-theme="autumn"] [data-type="h2"] { color:#9A3412 !important; } 
.sheet[data-theme="autumn"] [data-type="body"] { color:#7C2D12 !important; }
.sheet[data-theme="autumn"] .block[data-type="shape"] { background:#D14C1E !important; }

.sheet[data-theme="winter"] { background:#F0F9FF !important; border-top:12px solid #3B82F6 !important; }
.sheet[data-theme="winter"] [data-type="h1"] { color:#1E3A8A !important; } 
.sheet[data-theme="winter"] [data-type="h2"] { color:#3730A3 !important; } 
.sheet[data-theme="winter"] [data-type="body"] { color:#1E3A8A !important; }
.sheet[data-theme="winter"] .block[data-type="shape"] { background:#3B82F6 !important; }

.sheet[data-theme="medical"] { background:#F0FDFA !important; border-top:12px solid #14B8A6 !important; }
.sheet[data-theme="medical"] [data-type="h1"] { color:#115E59 !important; } 
.sheet[data-theme="medical"] [data-type="h2"] { color:#0F766E !important; } 
.sheet[data-theme="medical"] [data-type="body"] { color:#115E59 !important; }
.sheet[data-theme="medical"] .block[data-type="shape"] { background:#14B8A6 !important; }

.sheet[data-theme="cafe"] { background:#FBF7F0 !important; border-top:12px solid #C4A484 !important; }
.sheet[data-theme="cafe"] [data-type="h1"] { color:#4A3B2A !important; } 
.sheet[data-theme="cafe"] [data-type="h2"] { color:#6B5A48 !important; } 
.sheet[data-theme="cafe"] [data-type="body"] { color:#4A3B2A !important; }
.sheet[data-theme="cafe"] .block[data-type="shape"] { background:#C4A484 !important; }

/* ---------- utility ---------- */
.hidden{display:none !important}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);padding:12px 20px;border-radius:6px;border:1px solid var(--line);font:600 13px var(--f-ui);z-index:100;box-shadow:0 10px 20px rgba(0,0,0,0.3)}

@media print {
  @page { size: A4; margin: 0; }
  body { background: #fff; overflow: visible; }
  .topbar, .rail { display: none !important; }
  .app { display: block; height: auto; }
  .stage { padding: 0; background: none; overflow: visible; display: block; }
  .sheet { box-shadow: none; margin: 0; max-width: 100%; }
  .block-tools { display: none !important; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="10" width="80" height="80" rx="16" fill="#22262f" stroke="#2d313c" stroke-width="4"/>
      <path d="M30 25 H55 C65 25 70 32 70 40 C70 48 65 55 55 55 H40 V75 H30 Z" fill="#ff4d4d"/>
      <circle cx="65" cy="65" r="15" fill="#00e0ff" opacity="0.9"/>
      <rect x="55" y="55" width="20" height="20" fill="#0f1115" rx="4"/>
    </svg>
    <div class="brand-name">Poster<span>D45h</span></div>
  </div>
  <div class="actions">
    <button class="btn ghost" id="undoBtn">Undo</button>
    <button class="btn ghost" id="redoBtn">Redo</button>
    <button class="btn ghost" id="pngBtn">Export PNG</button>
    <button class="btn accent" id="printBtn">Print / PDF</button>
  </div>
</header>

<main class="app">
  <aside class="rail">
    <!-- Text Formatting -->
    <section class="panel">
      <div class="panel-title">Text Format</div>
      
      <div class="apply-all-wrapper">
        <input type="checkbox" id="applyAllChk">
        <label for="applyAllChk">Apply to ALL text blocks</label>
      </div>

      <!-- Row 1: Fonts & Sizes -->
      <div class="format-bar">
        <select class="fmt-select" id="fontSel" title="Font Family">
          <option value="Lexend">Lexend</option>
          <option value="Atkinson Hyperlegible">Atkinson</option>
          <option value="Poppins">Poppins</option>
          <option value="Merriweather">Merriweather</option>
          <option value="Arial">Arial</option>
        </select>
        <select class="fmt-select" id="sizeSel" title="Font Size">
          <option value="2">Small</option>
          <option value="3" selected>Normal</option>
          <option value="5">Large</option>
          <option value="7">X-Large</option>
        </select>
        <input type="color" class="fmt-color" id="textColor" value="#000000" title="Text Color">
        <input type="color" class="fmt-color" id="bgColor" value="#ffff00" title="Highlight Color">
      </div>

      <!-- Row 2: Weights & Lists -->
      <div class="format-bar">
        <button class="fmt-btn" data-cmd="bold" title="Bold"><b>B</b></button>
        <button class="fmt-btn" data-cmd="italic" title="Italic"><i>I</i></button>
        <button class="fmt-btn" data-cmd="underline" title="Underline"><u>U</u></button>
        <button class="fmt-btn" data-cmd="insertUnorderedList" title="Bullet List">•</button>
        <button class="fmt-btn" data-cmd="insertOrderedList" title="Number List">1.</button>
      </div>

      <!-- Row 3: Alignment -->
      <div class="format-bar">
        <button class="fmt-btn" data-cmd="justifyLeft" title="Align Left">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
        </button>
        <button class="fmt-btn" data-cmd="justifyCenter" title="Align Center">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="5" y1="18" x2="19" y2="18"/></svg>
        </button>
        <button class="fmt-btn" data-cmd="justifyRight" title="Align Right">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button class="fmt-btn" data-cmd="justifyFull" title="Justify">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
      <p style="font-size:11px; color:var(--text-dim); margin:8px 0 0 0;">Select text to format individually, or tick the box above to format everything.</p>
    </section>

    <section class="panel">
      <div class="panel-title">Add Blocks</div>
      <div class="block-grid">
        <button class="block-btn" data-add="h1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16M4 6h16M4 18h16"/></svg>Heading</button>
        <button class="block-btn" data-add="h2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 12h12M6 8h12M6 16h12"/></svg>Subhead</button>
        <button class="block-btn" data-add="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>Text</button>
        <button class="block-btn" data-add="shape"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Shape</button>
        <button class="block-btn" data-add="image" style="grid-column: span 2;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Image / Upload</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">Preset Layouts</div>
      <div class="tpl-list">
        <button class="tpl-btn" data-tpl="event">📋 Event Poster</button>
        <button class="tpl-btn" data-tpl="notice">⚠️ Important Notice</button>
        <button class="tpl-btn" data-tpl="schedule">🗓️ Daily Schedule</button>
        <button class="tpl-btn" data-tpl="menu">☕ Cafe Menu</button>
        <button class="tpl-btn" data-tpl="social">💬 Social Story</button>
        <button class="tpl-btn" data-tpl="nowNext">⏭️ Now & Next Board</button>
        <button class="tpl-btn" data-tpl="welcome">👋 Welcome Poster</button>
        <button class="tpl-btn" data-tpl="rules">📜 Classroom Rules</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">Sheet Settings</div>
      
      <div class="orient-list" style="margin-bottom: 16px;">
        <div style="font-size:11px; color:var(--text-dim); margin-bottom:4px; font-weight:700;">Orientation</div>
        <button class="orient-btn active" data-orient="portrait"><span style="font-size:16px">📄</span>Portrait</button>
        <button class="orient-btn" data-orient="landscape"><span style="font-size:16px">📃</span>Landscape</button>
      </div>

      <div class="theme-list">
        <div style="font-size:11px; color:var(--text-dim); margin-bottom:4px; font-weight:700;">Theme</div>
        <button class="theme-btn active" data-theme="default"><span class="color-dot" style="background:#fff"></span>Plain White</button>
        <button class="theme-btn" data-theme="spring"><span class="color-dot" style="background:#10B981"></span>Spring (Green)</button>
        <button class="theme-btn" data-theme="summer"><span class="color-dot" style="background:#F59E0B"></span>Summer (Yellow)</button>
        <button class="theme-btn" data-theme="autumn"><span class="color-dot" style="background:#D14C1E"></span>Autumn (Orange)</button>
        <button class="theme-btn" data-theme="winter"><span class="color-dot" style="background:#3B82F6"></span>Winter (Blue)</button>
        <button class="theme-btn" data-theme="medical"><span class="color-dot" style="background:#14B8A6"></span>Medical (Teal)</button>
        <button class="theme-btn" data-theme="cafe"><span class="color-dot" style="background:#C4A484"></span>Cafe (Cream)</button>
      </div>
    </section>
  </aside>

  <section class="stage" id="stage">
    <div class="sheet portrait" id="sheet" data-theme="default">
      <!-- Blocks injected here -->
    </div>
  </section>
</main>

<input type="file" id="imageUpload" class="hidden" accept="image/*">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  const sheet = document.getElementById('sheet');
  const stage = document.getElementById('stage');
  const imageUpload = document.getElementById('imageUpload');
  const applyAllChk = document.getElementById('applyAllChk');

  let history = [];
  let hIndex = -1;
  let currentTargetBlock = null;

  const placeholderText = {
    h1: "Main Headline",
    h2: "Sub Heading",
    body: "Click to edit text. You can type anything here. Make it long, make it short, make it punchy."
  };

  // Expanded Preset Templates
  const TEMPLATES = {
    event: {
      theme: 'winter', 
      blocks: [
        { type: 'h1', text: 'Coffee Morning', align: 'center' },
        { type: 'h2', text: 'Saturday, 10am – 12pm · St Mary’s Hall', align: 'center' },
        { type: 'shape', align: 'center' },
        { type: 'body', text: 'Join us for free tea, coffee, and cake at the community hall. Everyone is welcome! Bring a friend.', align: 'center' }
      ]
    },
    notice: {
      theme: 'autumn', 
      blocks: [
        { type: 'h1', text: 'Important Notice', align: 'left' },
        { type: 'shape', align: 'left' },
        { type: 'body', text: 'Please be aware that the building will be closed on Monday for maintenance. We will reopen on Tuesday at 9:00 AM.', align: 'left' }
      ]
    },
    schedule: {
      theme: 'spring', 
      blocks: [
        { type: 'h1', text: 'My Daily Routine', align: 'left' },
        { type: 'h2', text: 'Morning', align: 'left' },
        { type: 'body', text: 'Wake up and eat breakfast. Brush my teeth. Go to school.', align: 'left' },
        { type: 'h2', text: 'Afternoon', align: 'left' },
        { type: 'body', text: 'Eat lunch. Play with friends. Art and music.', align: 'left' }
      ]
    },
    menu: {
      theme: 'cafe', 
      blocks: [
        { type: 'h1', text: 'Today’s Menu', align: 'center' },
        { type: 'shape', align: 'center' },
        { type: 'h2', text: 'Starters', align: 'center' },
        { type: 'body', text: 'Soup of the day. Garlic bread.', align: 'center' },
        { type: 'h2', text: 'Mains', align: 'center' },
        { type: 'body', text: 'Sandwiches and salad. Cake and tea.', align: 'center' }
      ]
    },
    social: {
      theme: 'medical',
      blocks: [
        { type: 'h1', text: 'Going to the Doctor', align: 'left' },
        { type: 'shape', align: 'left' },
        { type: 'body', text: 'I feel sick. I go to the doctor with Mum. I sit in the big chair.', align: 'left' },
        { type: 'body', text: 'The doctor looks at my teeth. I am brave. I get a sticker.', align: 'left' }
      ]
    },
    nowNext: {
      theme: 'summer',
      blocks: [
        { type: 'h1', text: 'Now and Next', align: 'center' },
        { type: 'h2', text: 'NOW:', align: 'left' },
        { type: 'body', text: 'Tidy up the toys.', align: 'left' },
        { type: 'h2', text: 'NEXT:', align: 'left' },
        { type: 'body', text: 'Choose a game to play.', align: 'left' }
      ]
    },
    welcome: {
      theme: 'spring',
      blocks: [
        { type: 'h1', text: 'Welcome to Class 2!', align: 'center' },
        { type: 'shape', align: 'center' },
        { type: 'body', text: 'We are so happy to have you here. Please hang your coat on your peg and put your book bag in the box.', align: 'center' }
      ]
    },
    rules: {
      theme: 'autumn',
      blocks: [
        { type: 'h1', text: 'Our Classroom Rules', align: 'left' },
        { type: 'shape', align: 'left' },
        { type: 'body', text: '1. We listen to each other.\n2. We put our hands up to speak.\n3. We are kind and helpful.\n4. We look after our toys.', align: 'left' }
      ]
    }
  };

  function init() {
    sheet.innerHTML = `
      <div class="block" data-type="h1" contenteditable="true">${placeholderText.h1}</div>
      <div class="block" data-type="h2" contenteditable="true">${placeholderText.h2}</div>
      <div class="block" data-type="body" contenteditable="true">${placeholderText.body}</div>
    `;
    attachBlockListeners();
    pushHistory();
  }

  function attachBlockListeners() {
    document.querySelectorAll('.block').forEach(block => {
      if(block.dataset.attached) return;
      
      block.addEventListener('mouseenter', () => {
        block.classList.add('tools-visible');
        if(!block.querySelector('.block-tools')) {
          const tools = document.createElement('div');
          tools.className = 'block-tools';
          tools.innerHTML = `
            <button data-act="up" title="Move Up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg></button>
            <button data-act="down" title="Move Down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>
            <button data-act="del" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
          `;
          block.appendChild(tools);
          
          tools.addEventListener('click', (e) => {
            e.stopPropagation();
            const btn = e.target.closest('button');
            if(!btn) return;
            const act = btn.dataset.act;
            if(act === 'up' && block.previousElementSibling) {
              sheet.insertBefore(block, block.previousElementSibling);
            } else if(act === 'down' && block.nextElementSibling) {
              sheet.insertBefore(block.nextElementSibling, block);
            } else if(act === 'del') {
              block.remove();
            }
            pushHistory();
          });
        }
      });

      block.addEventListener('mouseleave', () => {
        block.classList.remove('tools-visible');
      });

      block.addEventListener('mousedown', (e) => {
        if(e.target.closest('.block-tools')) {
          e.preventDefault();
        }
      });

      block.dataset.attached = "true";
    });
  }

  // Add Block
  document.querySelectorAll('[data-add]').forEach(btn => {
    btn.onclick = () => {
      const type = btn.dataset.add;
      if(type === 'image') {
        currentTargetBlock = null;
        imageUpload.click();
        return;
      }

      const block = document.createElement('div');
      block.className = 'block';
      block.dataset.type = type;
      block.setAttribute('contenteditable', 'true');
      block.textContent = placeholderText[type] || "Edit me";
      
      sheet.appendChild(block);
      attachBlockListeners();
      pushHistory();
      block.focus();
    };
  });

  // Apply Templates
  document.querySelectorAll('[data-tpl]').forEach(btn => {
    btn.onclick = () => {
      const tplKey = btn.dataset.tpl;
      const tpl = TEMPLATES[tplKey];
      
      // Apply theme via rigid data-attribute
      sheet.setAttribute('data-theme', tpl.theme);
      document.querySelectorAll('.theme-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.theme === tpl.theme);
      });

      // Build blocks
      sheet.innerHTML = '';
      tpl.blocks.forEach(item => {
        const block = document.createElement('div');
        block.className = 'block';
        block.dataset.type = item.type;
        if(item.type !== 'shape') {
          block.setAttribute('contenteditable', 'true');
          block.textContent = item.text;
        }
        if(item.align) {
          block.style.textAlign = item.align;
        }
        sheet.appendChild(block);
      });
      attachBlockListeners();
      pushHistory();
      toast('Template loaded!');
    };
  });

  // Image Upload Handler
  imageUpload.onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      if(currentTargetBlock) {
        currentTargetBlock.style.backgroundImage = `url(${ev.target.result})`;
        currentTargetBlock.textContent = '';
      } else {
        const block = document.createElement('div');
        block.className = 'block';
        block.dataset.type = 'image';
        block.style.backgroundImage = `url(${ev.target.result})`;
        block.textContent = '';
        sheet.appendChild(block);
        attachBlockListeners();
        pushHistory();
      }
      imageUpload.value = '';
    };
    reader.readAsDataURL(file);
  };

  // --- TEXT FORMATTING LOGIC ---
  document.execCommand('styleWithCSS', false, true);

  // Helper: Apply to all blocks
  function formatAllBlocks(cmd, value) {
    document.querySelectorAll('.block[contenteditable="true"]').forEach(b => {
      b.focus(); // Required for execCommand to work on non-selected elements sometimes
      
      if(cmd === 'fontName') b.style.fontFamily = value;
      else if(cmd === 'fontSize') {
        const sizeMap = {'2': '12px', '3': '16px', '5': '24px', '7': '32px'};
        b.style.fontSize = sizeMap[value] || '16px';
      }
      else if(cmd === 'foreColor') b.style.color = value;
      else if(cmd === 'hiliteColor') b.style.backgroundColor = value;
      else if(cmd.startsWith('justify')) b.style.textAlign = cmd.replace('justify','').toLowerCase();
      else if(cmd === 'bold') b.style.fontWeight = (b.style.fontWeight === 'bold') ? 'normal' : 'bold';
      else if(cmd === 'italic') b.style.fontStyle = (b.style.fontStyle === 'italic') ? 'normal' : 'italic';
      else if(cmd === 'underline') b.style.textDecoration = (b.style.textDecoration === 'underline') ? 'none' : 'underline';
      else if(cmd === 'insertUnorderedList' || cmd === 'insertOrderedList') {
        // Lists are tricky to force globally via inline style, using execCommand as fallback
        document.execCommand(cmd, false, null);
      }
    });
  }

  document.querySelectorAll('[data-cmd]').forEach(btn => {
    btn.addEventListener('mousedown', (e) => { e.preventDefault(); });
    btn.onclick = () => {
      const cmd = btn.dataset.cmd;
      if(applyAllChk.checked) {
        formatAllBlocks(cmd, null);
      } else {
        document.execCommand(cmd, false, null);
      }
      pushHistory();
    };
  });

  document.getElementById('fontSel').onchange = (e) => {
    if(applyAllChk.checked) formatAllBlocks('fontName', e.target.value);
    else document.execCommand('fontName', false, e.target.value);
    pushHistory();
  };
  
  document.getElementById('sizeSel').onchange = (e) => {
    if(applyAllChk.checked) formatAllBlocks('fontSize', e.target.value);
    else document.execCommand('fontSize', false, e.target.value);
    pushHistory();
  };
  
  document.getElementById('textColor').addEventListener('input', (e) => {
    if(applyAllChk.checked) formatAllBlocks('foreColor', e.target.value);
    else document.execCommand('foreColor', false, e.target.value);
  });
  
  document.getElementById('bgColor').addEventListener('input', (e) => {
    if(applyAllChk.checked) formatAllBlocks('hiliteColor', e.target.value);
    else document.execCommand('hiliteColor', false, e.target.value);
  });

  // --- ORIENTATION & THEME LOGIC ---
  
  // Orientation Switcher
  document.querySelectorAll('[data-orient]').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.orient-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      sheet.classList.remove('portrait', 'landscape');
      sheet.classList.add(btn.dataset.orient);
      pushHistory();
    };
  });

  // Theme Switcher
  document.querySelectorAll('[data-theme]').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      sheet.setAttribute('data-theme', btn.dataset.theme); // Rigid data-attribute application
      pushHistory();
    };
  });

  // --- HISTORY / UNDO REDO ---
  function pushHistory() {
    history = history.slice(0, hIndex + 1);
    history.push(sheet.innerHTML);
    if(history.length > 50) history.shift();
    else hIndex++;
    updateUndoRedo();
  }

  function undo() { if(hIndex > 0) { hIndex--; sheet.innerHTML = history[hIndex]; attachBlockListeners(); updateUndoRedo(); } }
  function redo() { if(hIndex < history.length - 1) { hIndex++; sheet.innerHTML = history[hIndex]; attachBlockListeners(); updateUndoRedo(); } }

  function updateUndoRedo() {
    document.getElementById('undoBtn').disabled = hIndex <= 0;
    document.getElementById('redoBtn').disabled = hIndex >= history.length - 1;
  }

  document.getElementById('undoBtn').onclick = undo;
  document.getElementById('redoBtn').onclick = redo;

  // Save on text edits
  sheet.addEventListener('input', () => {
    clearTimeout(window.saveT);
    window.saveT = setTimeout(pushHistory, 500);
  });

  // --- EXPORT & PRINT ---
  document.getElementById('pngBtn').onclick = async () => {
    document.querySelectorAll('.block-tools').forEach(t => t.style.display = 'none');
    document.querySelectorAll('.block').forEach(b => b.style.border = 'none');
    
    const canvas = await html2canvas(sheet, { scale: 2, backgroundColor: null, logging: false });
    const link = document.createElement('a');
    link.download = 'posterd45h.png';
    link.href = canvas.toDataURL('image/png');
    link.click();

    document.querySelectorAll('.block-tools').forEach(t => t.style.removeProperty('display'));
    document.querySelectorAll('.block').forEach(b => b.style.removeProperty('border'));
    toast('PNG Exported!');
  };

  document.getElementById('printBtn').onclick = () => {
    document.querySelectorAll('.block-tools').forEach(t => t.style.display = 'none');
    document.querySelectorAll('.block').forEach(b => b.style.border = 'none');
    setTimeout(() => {
      window.print();
      setTimeout(() => {
        document.querySelectorAll('.block-tools').forEach(t => t.style.removeProperty('display'));
      }, 500);
    }, 100);
  };

  // --- TOAST ---
  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  }

  // --- INIT ---
  init();

})();
</script>
</body>
</html>
